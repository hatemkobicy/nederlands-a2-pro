<!DOCTYPE html>
<html lang="ar" dir="rtl" data-palette="indigo" data-dark="false">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nederlands A2 Pro — Interactive Dutch A2 Study Guide</title>

  <!-- Google Fonts: Cairo for Arabic, Inter for Dutch & English -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>

  <style>
    /* =====================================================================
       CSS CUSTOM PROPERTIES: 5 COLOR PALETTES + LIGHT & DARK MODES
       ===================================================================== */
    :root,
    [data-palette="indigo"] {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: #eef2ff;
      --primary-border: #c7d2fe;
      --primary-text: #3730a3;
      --hero-from: #3730a3;
      --hero-via: #4f46e5;
      --hero-to: #0284c7;
    }

    [data-palette="emerald"] {
      --primary: #059669;
      --primary-hover: #047857;
      --primary-soft: #ecfdf5;
      --primary-border: #a7f3d0;
      --primary-text: #065f46;
      --hero-from: #065f46;
      --hero-via: #059669;
      --hero-to: #0d9488;
    }

    [data-palette="purple"] {
      --primary: #7c3aed;
      --primary-hover: #6d28d9;
      --primary-soft: #f5f3ff;
      --primary-border: #ddd6fe;
      --primary-text: #5b21b6;
      --hero-from: #5b21b6;
      --hero-via: #7c3aed;
      --hero-to: #9333ea;
    }

    [data-palette="sunset"] {
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --primary-soft: #fff7ed;
      --primary-border: #fed7aa;
      --primary-text: #9a3412;
      --hero-from: #9a3412;
      --hero-via: #ea580c;
      --hero-to: #d97706;
    }

    [data-palette="rose"] {
      --primary: #e11d48;
      --primary-hover: #be123c;
      --primary-soft: #fff1f2;
      --primary-border: #fecdd3;
      --primary-text: #9f1239;
      --hero-from: #9f1239;
      --hero-via: #e11d48;
      --hero-to: #db2777;
    }

    /* Light Mode Surface Tokens */
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-subtle: #f1f5f9;
      --bg-sticky: rgba(255, 255, 255, 0.96);
      --border-main: #e2e8f0;
      --text-main: #0f172a;
      --text-body: #334155;
      --text-muted: #64748b;
      --tip-bg: #fffbeb;
      --tip-border: #fde68a;
      --tip-title: #92400e;
      --tip-text: #78350f;
      --quiz-bg: #f8fafc;
    }

    /* Dark Mode Surface Tokens */
    [data-dark="true"] {
      --bg-page: #0b1120;
      --bg-card: #111827;
      --bg-subtle: #1e293b;
      --bg-sticky: rgba(15, 23, 42, 0.96);
      --border-main: #1f2937;
      --text-main: #f8fafc;
      --text-body: #cbd5e1;
      --text-muted: #94a3b8;
      --primary-soft: rgba(99, 102, 241, 0.16);
      --primary-border: rgba(129, 140, 248, 0.35);
      --primary-text: #e0e7ff;
      --tip-bg: rgba(180, 83, 9, 0.16);
      --tip-border: rgba(245, 158, 11, 0.35);
      --tip-title: #fcd34d;
      --tip-text: #fef3c7;
      --quiz-bg: #0f172a;
    }

    [data-dark="true"][data-palette="emerald"] {
      --primary-soft: rgba(16, 185, 129, 0.16);
      --primary-border: rgba(52, 211, 153, 0.35);
      --primary-text: #a7f3d0;
    }
    [data-dark="true"][data-palette="purple"] {
      --primary-soft: rgba(139, 92, 246, 0.16);
      --primary-border: rgba(167, 139, 250, 0.35);
      --primary-text: #ddd6fe;
    }
    [data-dark="true"][data-palette="sunset"] {
      --primary-soft: rgba(234, 88, 12, 0.18);
      --primary-border: rgba(251, 146, 60, 0.38);
      --primary-text: #fed7aa;
    }
    [data-dark="true"][data-palette="rose"] {
      --primary-soft: rgba(225, 29, 72, 0.18);
      --primary-border: rgba(251, 113, 133, 0.38);
      --primary-text: #fecdd3;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }
    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      overflow-x: hidden;
      overflow-wrap: break-word;
      word-wrap: break-word;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    html[dir="rtl"] body { font-family: 'Cairo', sans-serif; }
    html[dir="ltr"] body { font-family: 'Inter', sans-serif; }
    .font-latin { font-family: 'Inter', sans-serif; }
    .font-arabic { font-family: 'Cairo', sans-serif; }
    .lesson-rich-text em {
      direction: ltr;
      unicode-bidi: isolate;
      font-family: 'Inter', sans-serif;
    }

    /* Dynamic Theme Utility Classes */
    .hero-gradient {
      background: linear-gradient(125deg, var(--hero-from), var(--hero-via), var(--hero-to));
    }
    .surface-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-main);
      color: var(--text-main);
    }
    .surface-subtle {
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-main);
    }
    .surface-sticky {
      background-color: var(--bg-sticky);
      border-bottom: 1px solid var(--border-main);
    }
    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
      border: 1px solid var(--primary);
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .badge-primary {
      background-color: var(--primary-soft);
      color: var(--primary-text);
      border: 1px solid var(--primary-border);
    }
    .text-body-c { color: var(--text-body); }
    .text-muted-c { color: var(--text-muted); }

    /* Semantic Grammar Color-Coding Tokens */
    .c-token {
      display: inline-block;
      padding: 0.1rem 0.45rem;
      margin: 0.12rem 0.05rem;
      border-radius: 0.5rem;
      border-width: 1px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .c-sub  { background: #dbeafe; color: #1d4ed8; border-color: #bfdbfe; }
    .c-verb { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }
    .c-rest { background: #d1fae5; color: #047857; border-color: #a7f3d0; }
    .c-conj { background: #ede9fe; color: #6d28d9; border-color: #ddd6fe; }
    .c-key  { background: #fef3c7; color: #b45309; border-color: #fde68a; }

    /* High-contrast Auxiliary Verb Badges (Light & Dark Mode) */
    .aux-hebben { background: #dbeafe; color: #1e3a8a; border-color: #93c5fd; }
    .aux-zijn   { background: #d1fae5; color: #064e3b; border-color: #6ee7b7; }
    .aux-both   { background: #ede9fe; color: #4c1d95; border-color: #c4b5fd; }
    .aux-none   { background: var(--bg-subtle); color: var(--text-main); border-color: var(--border-main); }

    /* Dark Mode Semantic Color Tokens */
    [data-dark="true"] .c-sub  { background: rgba(37, 99, 235, 0.22); color: #93c5fd; border-color: rgba(59, 130, 246, 0.4); }
    [data-dark="true"] .c-verb { background: rgba(220, 38, 38, 0.22); color: #fca5a5; border-color: rgba(239, 68, 68, 0.4); }
    [data-dark="true"] .c-rest { background: rgba(5, 150, 105, 0.22); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.4); }
    [data-dark="true"] .c-conj { background: rgba(124, 58, 237, 0.24); color: #c4b5fd; border-color: rgba(139, 92, 246, 0.45); }
    [data-dark="true"] .c-key  { background: rgba(217, 119, 6, 0.24); color: #fcd34d; border-color: rgba(245, 158, 11, 0.45); }

    [data-dark="true"] .aux-hebben { background: rgba(37, 99, 235, 0.28); color: #dbeafe; border-color: rgba(96, 165, 250, 0.5); }
    [data-dark="true"] .aux-zijn   { background: rgba(5, 150, 105, 0.28); color: #d1fae5; border-color: rgba(52, 211, 153, 0.5); }
    [data-dark="true"] .aux-both   { background: rgba(124, 58, 237, 0.30); color: #ede9fe; border-color: rgba(167, 139, 250, 0.5); }
    [data-dark="true"] .aux-none   { background: var(--bg-subtle); color: var(--text-main); border-color: var(--border-main); }

    /* Color Coding OFF override */
    .color-off .c-token {
      background: transparent !important;
      border-color: transparent !important;
      color: var(--text-main) !important;
      padding: 0 0.1rem;
      margin: 0;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade { animation: fadeSlide 0.22s ease-out; }

    /* Live & Total Visitor Counter Styles */
    .visitor-stats-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 0 auto 16px;
      padding: 0 8px;
      max-width: 640px;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 15px;
      border-radius: 999px;
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-main);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
      animation: pulseLive 1.8s infinite;
      flex-shrink: 0;
    }
    @keyframes pulseLive {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .stat-num {
      font-variant-numeric: tabular-nums;
      font-weight: 800;
      color: var(--primary);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- Toast Notification (Never uses alert/confirm) -->
  <div id="toast-container" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-4">
    <div id="toast-message" class="bg-slate-900 text-white text-xs sm:text-sm font-bold px-5 py-3 rounded-2xl shadow-2xl border border-slate-700"></div>
  </div>

  <!-- ===================================================================
       TOP HERO HEADER (Language Switcher + Dark Mode + 5 Color Swatches)
       =================================================================== -->
  <header class="hero-gradient text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 sm:py-5 space-y-4">

      <!-- Top Utility Bar: Language Version Switcher + Font Size + Palette + Dark Mode -->
      <div class="flex flex-wrap items-center justify-between gap-2.5 pb-3 border-b border-white/15">
        <!-- Language Mode Switcher -->
        <div class="inline-flex items-center gap-1 bg-black/25 backdrop-blur-md p-1 rounded-2xl border border-white/20" role="group" aria-label="Language Version">
          <button
            id="lang-btn-ar"
            type="button"
            onclick="setLangMode('ar')"
            class="px-3 py-1 rounded-xl text-xs font-extrabold transition cursor-pointer"
          >🇸🇦 عربي + 🇳🇱 هولندي + 🇬🇧 EN</button>
          <button
            id="lang-btn-en"
            type="button"
            onclick="setLangMode('en')"
            class="px-3 py-1 rounded-xl text-xs font-extrabold transition cursor-pointer font-latin"
          >🇬🇧 English + 🇳🇱 Dutch</button>
        </div>

        <!-- Theme Controls: Font Size + 5 Color Swatches + Dark/Light Toggle -->
        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
          <!-- Global Font Size Controls (A- / A / A+) -->
          <div class="inline-flex items-center gap-1 bg-black/25 backdrop-blur-md px-2 py-1 rounded-2xl border border-white/20" role="group" aria-label="Font Size">
            <button
              id="font-dec-btn"
              type="button"
              onclick="changeFontSize(-1)"
              title="Decrease font size"
              class="px-2 py-0.5 rounded-xl text-xs font-extrabold text-white hover:bg-white/20 transition cursor-pointer font-latin disabled:opacity-40"
            >A-</button>
            <button
              id="font-reset-btn"
              type="button"
              onclick="resetFontSize()"
              title="Reset font size (100%)"
              class="px-2 py-0.5 rounded-xl text-xs font-extrabold text-white/95 hover:bg-white/20 transition cursor-pointer font-latin"
            >A</button>
            <button
              id="font-inc-btn"
              type="button"
              onclick="changeFontSize(1)"
              title="Increase font size"
              class="px-2 py-0.5 rounded-xl text-xs font-extrabold text-white hover:bg-white/20 transition cursor-pointer font-latin disabled:opacity-40"
            >A+</button>
          </div>

          <div class="inline-flex items-center gap-1.5 bg-black/20 backdrop-blur-md px-2.5 py-1.5 rounded-2xl border border-white/20">
            <span id="palette-label" class="text-[11px] font-bold text-white/90 mx-1"></span>
            <button type="button" onclick="setPalette('indigo')" data-swatch="indigo" title="Ocean Indigo" class="w-5 h-5 rounded-full bg-[#4f46e5] border-2 border-white transition transform hover:scale-110 cursor-pointer"></button>
            <button type="button" onclick="setPalette('emerald')" data-swatch="emerald" title="Emerald Forest" class="w-5 h-5 rounded-full bg-[#059669] border-2 border-white transition transform hover:scale-110 cursor-pointer"></button>
            <button type="button" onclick="setPalette('purple')" data-swatch="purple" title="Royal Purple" class="w-5 h-5 rounded-full bg-[#7c3aed] border-2 border-white transition transform hover:scale-110 cursor-pointer"></button>
            <button type="button" onclick="setPalette('sunset')" data-swatch="sunset" title="Warm Sunset" class="w-5 h-5 rounded-full bg-[#ea580c] border-2 border-white transition transform hover:scale-110 cursor-pointer"></button>
            <button type="button" onclick="setPalette('rose')" data-swatch="rose" title="Berry Rose" class="w-5 h-5 rounded-full bg-[#e11d48] border-2 border-white transition transform hover:scale-110 cursor-pointer"></button>
          </div>

          <button
            id="dark-mode-btn"
            type="button"
            onclick="toggleDarkMode()"
            class="inline-flex items-center gap-1.5 bg-black/25 hover:bg-black/35 backdrop-blur-md px-3 py-1.5 rounded-2xl border border-white/25 text-xs sm:text-sm font-bold transition cursor-pointer"
          ></button>
        </div>
      </div>

      <!-- Main Header Content: Title + Progress + Search -->
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div class="space-y-1.5 min-w-0">
          <div class="inline-flex items-center gap-2 bg-white/15 backdrop-blur-sm border border-white/25 px-3 py-1 rounded-full text-xs font-bold">
            <span>🇳🇱</span>
            <span class="bg-white text-slate-900 font-latin font-extrabold px-1.5 rounded text-[11px]">Abc</span>
            <span id="hero-pill-text"></span>
          </div>
          <h1 id="hero-title" class="text-2xl sm:text-3xl font-black tracking-tight leading-snug"></h1>
          <p id="hero-subtitle" class="text-white/85 text-xs sm:text-sm font-medium"></p>
        </div>

        <!-- Progress & Search Panel -->
        <div class="flex flex-col sm:flex-row lg:flex-col gap-3 lg:w-96 shrink-0">
          <!-- Progress Box -->
          <div class="bg-black/20 backdrop-blur-md border border-white/20 rounded-2xl p-3.5 flex-1">
            <div class="flex items-center justify-between text-xs font-bold mb-1.5 gap-2">
              <span id="progress-title"></span>
              <div class="flex items-center gap-1.5 shrink-0">
                <span id="studied-badge" class="bg-black/30 text-white px-2 py-0.5 rounded-full text-[11px] font-bold"></span>
                <span id="quiz-badge" class="bg-white text-slate-900 font-latin px-2 py-0.5 rounded-full text-[11px] font-extrabold"></span>
              </div>
            </div>
            <div class="w-full h-2.5 bg-black/30 rounded-full overflow-hidden">
              <div id="global-progress-bar" class="h-full bg-gradient-to-r from-emerald-300 to-teal-200 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex items-center justify-between mt-2 text-[11px] text-white/90 gap-2">
              <span id="progress-status" class="truncate"></span>
              <button id="reset-all-btn" type="button" class="underline hover:text-white font-bold shrink-0 cursor-pointer"></button>
            </div>
          </div>

          <!-- Global Search -->
          <div class="relative flex-1">
            <input
              id="global-search"
              type="text"
              autocomplete="off"
              class="w-full rounded-2xl bg-white text-slate-900 placeholder-slate-400 text-xs sm:text-sm font-semibold px-4 py-2.5 shadow-md focus:outline-none focus:ring-2 focus:ring-amber-300"
            />
            <button id="clear-search-btn" type="button" class="hidden absolute top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-900 font-bold text-sm px-2 cursor-pointer">✕</button>
            <div id="search-results" class="hidden absolute right-0 left-0 top-full mt-2 surface-card rounded-2xl shadow-2xl max-h-80 overflow-y-auto z-50 divide-y divide-slate-200/40"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================================================================
       CONTROL BAR: MAIN 3-SECTION SWITCHER + GRAMMAR SUB-CONTROLS
       =================================================================== -->
  <section class="surface-sticky backdrop-blur-md shadow-sm z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 space-y-3">

      <!-- Prominent Top 3-Section Switcher -->
      <nav id="main-section-nav" aria-label="Main Sections" class="flex flex-wrap items-center justify-center sm:justify-start gap-2"></nav>

      <!-- Grammar-Only Controls: Color Legend + Display Toggles + Wrapping Thema 1..8 Bar -->
      <div id="grammar-controls-wrap" class="space-y-3 pt-2.5 border-t" style="border-color: var(--border-main);">
        <div class="flex flex-col xl:flex-row xl:items-center xl:justify-between gap-2.5">
          <div id="color-legend" class="flex flex-wrap items-center gap-1.5 text-[11px] sm:text-xs"></div>
          <div id="display-toggles" class="flex flex-wrap items-center gap-1.5 shrink-0"></div>
        </div>
        <nav id="theme-nav" aria-label="Themes" class="flex flex-wrap items-center gap-2 pt-2.5 border-t" style="border-color: var(--border-main);"></nav>
      </div>
    </div>
  </section>

  <!-- ===================================================================
       MAIN WORKSPACE (Sidebar + Lesson Content / Irregular Verbs)
       =================================================================== -->
  <div class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-7 flex-1">
    <!-- Mobile Lesson Selector -->
    <div id="mobile-lesson-bar" class="lg:hidden mb-4"></div>

    <div class="flex flex-col lg:flex-row gap-6 items-start">
      <!-- Desktop Sidebar -->
      <aside id="desktop-sidebar-wrap" class="hidden lg:block w-80 shrink-0 lg:sticky lg:top-4">
        <div class="surface-card rounded-3xl shadow-sm p-4">
          <div id="sidebar-header" class="pb-3 mb-2.5 border-b" style="border-color: var(--border-main);"></div>
          <nav id="desktop-sidebar" class="flex flex-col gap-1.5 max-h-[70vh] overflow-y-auto"></nav>
        </div>
      </aside>

      <!-- Main Content Panel -->
      <main id="main-content" class="flex-1 w-full min-w-0 space-y-5"></main>
    </div>
  </div>

  <!-- ===================================================================
       FOOTER WITH LIVE VISITOR STATS + HATEM KOBICY ATTRIBUTION & EMAIL
       =================================================================== -->
  <footer class="mt-10 border-t surface-card py-6 px-4">
    <!-- Live & Total Visitor Counter (Firebase Realtime Database) -->
    <div id="visitor-stats-bar" class="visitor-stats-bar" aria-live="polite">
      <div class="stat-pill">
        <span class="live-dot"></span>
        <span id="lbl-online">متصل الآن:</span>
        <span id="val-online" class="stat-num font-latin">...</span>
      </div>
      <div class="stat-pill">
        <span>👁️</span>
        <span id="lbl-total">إجمالي الزيارات:</span>
        <span id="val-total" class="stat-num font-latin">...</span>
      </div>
    </div>

    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-start">
      <div class="space-y-1">
        <p id="footer-credit" class="text-sm sm:text-base font-extrabold"></p>
        <p id="footer-sub" class="text-xs text-muted-c font-medium"></p>
      </div>
      <a
        href="mailto:HATEM.KOBICY@GMAIL.COM"
        class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl badge-primary font-latin text-xs sm:text-sm font-bold hover:opacity-90 transition shadow-sm"
      >
        <span>✉️</span>
        <span>HATEM.KOBICY@GMAIL.COM</span>
      </a>
    </div>
  </footer>

  <script>
    // =========================================================================
    // 1. UI TRANSLATION STRINGS (ARABIC vs ENGLISH-ONLY MODE)
    // =========================================================================
    const UI = {
      ar: {
        pageTitle: 'منصة الهولندية A2 التفاعلية — القواعد، الكلمات، الأفعال الشاذة والامتحانات',
        heroPill: 'المنهج الشامل • 47 قاعدة • 184 كلمة • 118 فعلاً شاذّاً • 8 امتحانات',
        heroTitle: 'منصة الهولندية <span class="font-latin">A2</span> التفاعلية',
        heroSubtitle: 'دليل شامل للقواعد، الكلمات، الأفعال الشاذة والامتحانات — مستوى A2',
        paletteLabel: '🎨 اللون:',
        darkBtn: '🌙 ليلي',

        if (['grammar', 'vocab', 'verbs', 'exams'].includes(sec)) state.activeSection = sec;

        const exTh = parseInt(localStorage.getItem(LS_KEYS.examThema), 10);
        if (!Number.isNaN(exTh) && exTh >= 1 && exTh <= 8) state.activeExamThema = exTh;

        const progRaw = localStorage.getItem(LS_KEYS.progress);
        if (progRaw) {
          const prog = JSON.parse(progRaw);
          if (prog.answers && typeof prog.answers === 'object') state.answers = prog.answers;
          if (prog.studied && typeof prog.studied === 'object') state.studied = prog.studied;
        }

        const mastRaw = localStorage.getItem(LS_KEYS.mastered);
        if (mastRaw) {
          const mast = JSON.parse(mastRaw);
          if (mast.learnedVocab && typeof mast.learnedVocab === 'object') state.learnedVocab = mast.learnedVocab;
          if (mast.learnedVerbs && typeof mast.learnedVerbs === 'object') state.learnedVerbs = mast.learnedVerbs;
        }

        const scoresRaw = localStorage.getItem(LS_KEYS.examScores);
        if (scoresRaw) {
          const scores = JSON.parse(scoresRaw);
          if (scores && typeof scores === 'object') state.examBestScores = scores;
        }
      } catch (e) { /* Ignore storage issues */ }
    }

    function saveState() {
      try {
        localStorage.setItem(LS_KEYS.lang, state.lang);
        localStorage.setItem(LS_KEYS.theme, state.palette);
        localStorage.setItem(LS_KEYS.dark, String(state.dark));
        localStorage.setItem(LS_KEYS.font, String(state.fontIdx));
        localStorage.setItem(LS_KEYS.section, state.activeSection);
        localStorage.setItem(LS_KEYS.examThema, String(state.activeExamThema));
        localStorage.setItem(LS_KEYS.progress, JSON.stringify({
          answers: state.answers,
          studied: state.studied,
        }));
        localStorage.setItem(LS_KEYS.mastered, JSON.stringify({
          learnedVocab: state.learnedVocab,
          learnedVerbs: state.learnedVerbs,
        }));
        localStorage.setItem(LS_KEYS.examScores, JSON.stringify(state.examBestScores));
      } catch (e) { /* Ignore */ }
    }

    // =========================================================================
    // 7. HELPERS: SMART SORT, NORMALIZATION, TOKEN PARSER, TOAST, TTS AUDIO
    // =========================================================================
    function t() {
      return UI[state.lang];
    }

    function normalizeDutch(str) {
      return String(str || '')
        .trim()
        .toLowerCase()
        .replace(/[’‘`]/g, "'")
        .replace(/[.?!,]+$/g, '')
        .replace(/\s+/g, ' ');
    }

    function isAnswerMatch(userVal, acceptedList) {
      const norm = normalizeDutch(userVal);
      if (!norm) return false;
      return acceptedList.some((a) => normalizeDutch(a) === norm);
    }

    function sortKeyDutch(str) {
      return String(str)
        .toLowerCase()
        .replace(/^(de|het|een|zich)\s+/i, '')
        .trim();
    }

    function impBadgeHtml(imp) {
      if (imp === 3) {
        return `<span class="text-[11px] font-extrabold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-700 dark:text-amber-300 border border-amber-500/35">${t().imp3}</span>`;
      }
      if (imp === 2) {
        return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-sky-500/15 text-sky-700 dark:text-sky-300 border border-sky-500/30">${t().imp2}</span>`;
      }
      return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full surface-subtle text-muted-c">${t().imp1}</span>`;
    }

    function auxPillClass(aux) {
      if (aux === 'zijn') return 'aux-zijn';
      if (aux === 'both') return 'aux-both';
      if (aux === 'hebben') return 'aux-hebben';
      return 'aux-none';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function parseDutchTokens(markup) {
      return markup.replace(/\[(sub|verb|rest|conj|key):([^\]]+)\]/g, (_, cls, text) => {
        return `<span class="c-token c-${cls}">${escapeHtml(text)}</span>`;
      });
    }

    let toastTimer = null;
    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const box = document.getElementById('toast-message');
      box.textContent = msg;
      container.classList.remove('opacity-0', 'translate-y-4');
      container.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        container.classList.add('opacity-0', 'translate-y-4');
        container.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    }

    function speakDutch(plainText, btn) {
      try {
        if (!('speechSynthesis' in window)) {
          showToast(t().ttsUnsupported);
          return;
        }
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(plainText);
        utter.lang = 'nl-NL';
        utter.rate = 0.92;
        const voices = window.speechSynthesis.getVoices();
        const nlVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('nl'));
        if (nlVoice) utter.voice = nlVoice;

        const origHtml = btn.innerHTML;
        btn.innerHTML = `<span>🔊</span><span class="hidden sm:inline">${t().speakingBtn}</span>`;
        btn.classList.add('ring-2', 'ring-sky-400');

        const cleanup = () => {
          btn.innerHTML = origHtml;
          btn.classList.remove('ring-2', 'ring-sky-400');
        };
        utter.onend = cleanup;
        utter.onerror = () => { cleanup(); showToast(t().ttsError); };
        window.speechSynthesis.speak(utter);
      } catch (e) {
        showToast(t().ttsError);
      }
    }

    // Event delegation for ALL TTS buttons (safely handles apostrophes like foto's)
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tts]');
      if (!btn) return;
      const text = btn.getAttribute('data-tts');
      if (text) speakDutch(text, btn);
    });

    function isLessonQuizPassed(lesson) {
      return lesson.quiz.every((q, idx) => state.answers[`${lesson.id}-${idx}`] === q.ans);
    }

    function getLessonCorrectCount(lesson) {
      return lesson.quiz.reduce((acc, q, idx) => acc + (state.answers[`${lesson.id}-${idx}`] === q.ans ? 1 : 0), 0);
    }

    // =========================================================================
    // 7. APPLY DOCUMENT DIRECTION, PALETTE, DARK MODE & HEADER TEXT
    // =========================================================================
    function applyDocumentSettings() {
      const root = document.documentElement;
      root.lang = state.lang;
      root.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      root.setAttribute('data-palette', state.palette);
      root.setAttribute('data-dark', state.dark ? 'true' : 'false');
      root.classList.toggle('dark', state.dark);
      root.style.fontSize = `${FONT_SIZES[state.fontIdx]}%`;
      document.title = t().pageTitle;

      // Update language switcher buttons
      const arBtn = document.getElementById('lang-btn-ar');
      const enBtn = document.getElementById('lang-btn-en');
      if (arBtn && enBtn) {
        arBtn.className = `px-3 py-1 rounded-xl text-xs font-extrabold transition cursor-pointer ${
          state.lang === 'ar' ? 'bg-white text-slate-900 shadow-sm' : 'text-white/85 hover:bg-white/15'
        }`;
        enBtn.className = `px-3 py-1 rounded-xl text-xs font-extrabold transition cursor-pointer font-latin ${
          state.lang === 'en' ? 'bg-white text-slate-900 shadow-sm' : 'text-white/85 hover:bg-white/15'
        }`;
      }

      // Update font size controls
      const fDec = document.getElementById('font-dec-btn');
      const fRes = document.getElementById('font-reset-btn');
      const fInc = document.getElementById('font-inc-btn');
      if (fDec && fRes && fInc) {
        fDec.disabled = state.fontIdx <= 0;
        fInc.disabled = state.fontIdx >= FONT_SIZES.length - 1;
        fRes.textContent = FONT_SIZES[state.fontIdx] === 100 ? 'A' : `${FONT_SIZES[state.fontIdx]}%`;
      }

      // Update palette swatches active ring
      document.querySelectorAll('[data-swatch]').forEach((btn) => {
        const isActive = btn.getAttribute('data-swatch') === state.palette;
        btn.classList.toggle('ring-2', isActive);
        btn.classList.toggle('ring-amber-300', isActive);
        btn.classList.toggle('scale-110', isActive);
      });

      // Header texts
      document.getElementById('palette-label').textContent = t().paletteLabel;
      document.getElementById('dark-mode-btn').textContent = state.dark ? t().lightBtn : t().darkBtn;
      document.getElementById('hero-pill-text').textContent = t().heroPill;
      document.getElementById('hero-title').innerHTML = t().heroTitle;
      document.getElementById('hero-subtitle').textContent = t().heroSubtitle;
      document.getElementById('progress-title').textContent = t().progressTitle;
      document.getElementById('reset-all-btn').textContent = t().resetAll;

      // Global search placeholder & clear button alignment
      const gSearch = document.getElementById('global-search');
      const gClear = document.getElementById('clear-search-btn');
      if (gSearch) gSearch.placeholder = t().searchPlaceholder;
      if (gClear) {
        gClear.classList.remove('left-2', 'right-2');
        gClear.classList.add(state.lang === 'ar' ? 'left-2' : 'right-2');
      }

      // Footer
      document.getElementById('footer-credit').innerHTML = t().footerCredit;
      document.getElementById('footer-sub').textContent = t().footerSub;
    }

    // =========================================================================
    // 8. RENDER PROGRESS, SECTION NAV, COLOR LEGEND, THEMES & SIDEBAR
    // =========================================================================
    function renderProgress() {
      const studiedCount = LESSONS.filter((l) => !!state.studied[l.id]).length;
      const correctCount = LESSONS.reduce((acc, l) => acc + getLessonCorrectCount(l), 0);
      const totalUnits = TOTAL_LESSONS + TOTAL_QUESTIONS;
      const pct = totalUnits > 0 ? Math.round(((studiedCount + correctCount) / totalUnits) * 100) : 0;

      const studiedEl = document.getElementById('studied-badge');
      const quizEl = document.getElementById('quiz-badge');
      const barEl = document.getElementById('global-progress-bar');
      const statusEl = document.getElementById('progress-status');

      if (studiedEl) studiedEl.textContent = `${studiedCount}/${TOTAL_LESSONS} ${t().lessonsUnit}`;
      if (quizEl) quizEl.textContent = `${correctCount}/${TOTAL_QUESTIONS} ✓`;
      if (barEl) barEl.style.width = `${pct}%`;
      if (statusEl) {
        if (pct === 0) statusEl.textContent = t().progressStart;
        else if (pct >= 100) statusEl.textContent = t().progressDone;
        else statusEl.textContent = t().progressPct(pct);
      }
    }

    function renderThemeNav() {
      const nav = document.getElementById('theme-nav');
      if (!nav || state.activeSection !== 'grammar') return;

      nav.innerHTML = THEMES.map((th) => {

        const doneCount = themeLessons.filter((l) => state.studied[l.id] || isLessonQuizPassed(l)).length;
        const allDone = themeLessons.length > 0 && doneCount === themeLessons.length;

        return `
          <button
            type="button"
            onclick="selectTheme(${th.id})"
            class="px-3 py-1.5 rounded-2xl text-xs font-extrabold transition flex items-center gap-1.5 cursor-pointer border ${
              active ? 'btn-primary shadow-md' : 'surface-card hover:opacity-85'

      const learnedCount = Object.values(state.learnedVocab).filter(Boolean).length;

    // =========================================================================
    // 11. MAIN SECTION 3: IRREGULAR VERBS VIEW (ALL 118 OFFICIAL VERBS)
    // =========================================================================
    function renderIrregularVerbsView(container) {
      const q = state.verbSearch.trim().toLowerCase();
      let list = IRREGULAR_VERBS.filter((v) => {
        if (state.verbAuxFilter !== 'all' && v.aux !== state.verbAuxFilter) return false;
        if (state.verbThema !== 'all' && v.thema !== state.verbThema) return false;
        if (!q) return true;
        return (
          v.inf.toLowerCase().includes(q) ||
          v.ovtSg.toLowerCase().includes(q) ||
          v.ovtPl.toLowerCase().includes(q) ||
          v.vd.toLowerCase().includes(q) ||
          v.en.toLowerCase().includes(q) ||
          v.ar.includes(q) ||
          v.ex.toLowerCase().includes(q)
        );
      });

      list = [...list].sort((a, b) => {
        if (state.verbSort === 'alpha') return a.inf.localeCompare(b.inf, 'nl');
        if (state.verbSort === 'imp') return (b.imp - a.imp) || a.inf.localeCompare(b.inf, 'nl');
        return (a.thema - b.thema) || a.inf.localeCompare(b.inf, 'nl');
      });

      const learnedCount = Object.values(state.learnedVerbs).filter(Boolean).length;

      const sortBtns = [
        { id: 'alpha', label: t().sortAlpha },
        { id: 'imp', label: t().sortImp },
        { id: 'thema', label: t().sortThema },
      ].map((s) => `
        <button
          type="button"
          onclick="setVerbSort('${s.id}')"
          class="px-3 py-1.5 rounded-xl text-xs font-extrabold border transition cursor-pointer ${
            state.verbSort === s.id ? 'btn-primary shadow-sm' : 'surface-subtle hover:opacity-85'
          }"
        >${s.label}</button>
      `).join('');

    // =========================================================================
    // 11B. MAIN SECTION 4: INTERACTIVE EXAMS (TOETSEN THEMA 1–8)
    // =========================================================================
    function computeExamScore(exam, sess) {
      let score = 0;
      let total = 0;

      // Part 1: Listening (5 MCQs)
      exam.listening.questions.forEach((q, i) => {
        total++;
        if (sess.p1[i] === q.ans) score++;
      });

      // Part 2: Reading (5 MCQs)
      exam.reading.questions.forEach((q, i) => {
        total++;
        if (sess.p2[i] === q.ans) score++;
      });

      // Part 3: Grammar 1 (5 items, 1 or 2 blanks)
      exam.grammar1.items.forEach((item, i) => {
        total++;
        const ok1 = isAnswerMatch(sess.p3[`${i}-0`], item.ans);
        const ok2 = item.ans2 ? isAnswerMatch(sess.p3[`${i}-1`], item.ans2) : true;
        if (ok1 && ok2) score++;
      });

      // Part 4: Grammar 2 (5 items, 1 or 2 blanks)
      exam.grammar2.items.forEach((item, i) => {
        total++;
        const ok1 = isAnswerMatch(sess.p4[`${i}-0`], item.ans);
        const ok2 = item.ans2 ? isAnswerMatch(sess.p4[`${i}-1`], item.ans2) : true;
        if (ok1 && ok2) score++;
      });

      // Part 5: Writing (5 self-checked items)
      exam.writing.items.forEach((_, i) => {
        total++;
        if (sess.p5Check[i]) score++;
      });

      // Part 6: Vocabulary (10 items)
      exam.vocab.items.forEach((item, i) => {
        total++;
        if (isAnswerMatch(sess.p6[i], item.ans)) score++;
      });

      return { score, total, pct: Math.round((score / total) * 100) };
    }

    function renderExamsView(container) {
      const exam = EXAMS.find((e) => e.thema === state.activeExamThema) || EXAMS[0];
      const sess = getExamSession(exam.thema);
      const isChecked = !!sess.checked;
      const isPlaying = state.examPlayingThema === exam.thema;
      const result = computeExamScore(exam, sess);

      // Exam Theme Selector Bar (always wrapped, shows best score)
      const examTabsHtml = EXAMS.map((ex) => {
        const active = ex.thema === exam.thema;
        const best = state.examBestScores[ex.thema];
        const badge = best !== undefined
          ? `<span class="font-latin text-[10px] px-1.5 py-0.5 rounded-full font-extrabold ${
              best >= 60
                ? (active ? 'bg-emerald-300 text-emerald-950' : 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300')
                : (active ? 'bg-amber-300 text-amber-950' : 'bg-amber-500/20 text-amber-700 dark:text-amber-300')
            }">${best}%${best >= 60 ? ' ✓' : ''}</span>`
          : '';
        return `
          <button
            type="button"
            onclick="selectExamThema(${ex.thema})"
            class="px-3 py-2 rounded-2xl text-xs font-extrabold transition flex items-center gap-1.5 cursor-pointer border ${
              active ? 'btn-primary shadow-md' : 'surface-card hover:opacity-85'
            }"
          >
            <span class="font-latin">Toets ${ex.thema}</span>
            ${badge}
          </button>
        `;
      }).join('');

      // Helper for rendering MCQ blocks (Parts 1 & 2)
      const renderMcqList = (questions, partKey) => questions.map((q, qIdx) => {
        const chosen = sess[partKey][qIdx];
        const optsHtml = q.options.map((opt, oIdx) => {
          let cls = 'surface-subtle hover:opacity-90';
          let mark = '';
          if (isChecked) {
            if (oIdx === q.ans) {
              cls = 'bg-emerald-500/20 text-emerald-700 dark:text-emerald-300 border-emerald-500 ring-2 ring-emerald-400/30';
              mark = '✅';
            } else if (oIdx === chosen) {
              cls = 'bg-rose-500/20 text-rose-700 dark:text-rose-300 border-rose-500 ring-2 ring-rose-400/30';
              mark = '❌';
            } else {
              cls = 'surface-subtle opacity-60';
            }
          } else if (oIdx === chosen) {
            cls = 'badge-primary ring-2 ring-current/25';
            mark = '●';
          }
          const letter = String.fromCharCode(97 + oIdx);
          return `
            <button
              type="button"
              onclick="selectExamMcq(${exam.thema}, '${partKey}', ${qIdx}, ${oIdx})"

      // Helper for Grammar fill-in-the-blank (Parts 3 & 4)
      const renderGrammarFill = (items, partKey) => items.map((item, i) => {
        const val0 = sess[partKey][`${i}-0`] || '';

              ${item.before ? `<span>${escapeHtml(item.before)}</span>` : ''}
              <input

              ${
                item.ans2

                      type="text"

      // Part 5: Writing
      const writingHtml = exam.writing.items.map((item, i) => {

      // Part 6: Vocabulary (10 items)
      const vocabHtml = exam.vocab.items.map((item, i) => {

          <!-- PART 1: LISTENING (GENERATED DUTCH AUDIO) -->

            <h3 class="text-base sm:text-lg font-black">${t().examPart1}</h3>

            <!-- Audio Player Bar -->
            <div class="surface-subtle rounded-2xl p-4 space-y-3">
              <div class="flex flex-wrap items-center gap-2">
                <button

                    isPlaying ? 'bg-rose-600 text-white shadow-md' : 'btn-primary shadow-sm'

                <button
                  type="button"
                  onclick="toggleExamSpeed()"
                  class="px-3 py-2 rounded-xl surface-card text-xs font-bold cursor-pointer hover:opacity-85"
                >${state.examRate < 0.9 ? t().examSpeedSlow : t().examSpeedNormal}</button>

                <button
                  type="button"
                  onclick="toggleExamTranscript(${exam.thema})"
                  class="px-3 py-2 rounded-xl badge-primary text-xs font-bold cursor-pointer hover:opacity-90"
                >${sess.showTranscript ? t().examHideTranscript : t().examShowTranscript}</button>

                ${isPlaying ? `<span class="text-xs font-extrabold animate-pulse" style="color: var(--primary);">${t().examPlaying}</span>` : ''}
              </div>
              <p class="text-[11px] font-semibold text-muted-c">${t().examTranscriptNote}</p>
              ${
                sess.showTranscript
                  ? `<div dir="ltr" class="surface-card rounded-xl p-3.5 font-latin text-xs sm:text-sm leading-relaxed text-left border-l-4" style="border-left-color: var(--primary);">
                      ${escapeHtml(exam.listening.script)}
                    </div>`
                  : ''
              }
            </div>

            <div class="grid gap-3">${renderMcqList(exam.listening.questions, 'p1')}</div>
          </section>

          <!-- PART 2: READING -->
          <section class="surface-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-4">
            <h3 class="text-base sm:text-lg font-black">${t().examPart2}</h3>
            <div dir="ltr" class="rounded-2xl border p-4 sm:p-5 text-left font-latin" style="border-color: var(--primary-border); background: var(--quiz-bg);">
              <h4 class="text-sm sm:text-base font-black mb-3" style="color: var(--primary);">${escapeHtml(exam.reading.title)}</h4>
              ${exam.reading.html}

          <!-- PART 3: GRAMMAR 1 -->

            <p dir="ltr" class="font-latin text-xs sm:text-sm font-bold text-muted-c text-left">${escapeHtml(exam.grammar1.instruction)}</p>
            <div class="grid gap-2.5">${renderGrammarFill(exam.grammar1.items, 'p3')}</div>
          </section>

          <!-- PART 4: GRAMMAR 2 -->
          <section class="surface-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-3">
            <h3 class="text-base sm:text-lg font-black">${t().examPart4}</h3>
            <p dir="ltr" class="font-latin text-xs sm:text-sm font-bold text-muted-c text-left">${escapeHtml(exam.grammar2.instruction)}</p>
            <div class="grid gap-2.5">${renderGrammarFill(exam.grammar2.items, 'p4')}</div>

          <!-- PART 5: WRITING -->
          <section class="surface-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-3">
            <h3 class="text-base sm:text-lg font-black">${t().examPart5}</h3>
            <p dir="ltr" class="font-latin text-xs sm:text-sm font-bold text-muted-c text-left">${escapeHtml(exam.writing.instruction)}</p>
            <div class="grid gap-3">${writingHtml}</div>

          <!-- PART 6: VOCABULARY -->
          <section class="surface-card rounded-3xl p-5 sm:p-6 shadow-sm space-y-3">
            <h3 class="text-base sm:text-lg font-black">${t().examPart6}</h3>
            <p dir="ltr" class="font-latin text-xs sm:text-sm font-bold text-muted-c text-left">${escapeHtml(exam.vocab.instruction)}</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">${vocabHtml}</div>
          </section>

          <!-- EXAM ACTION BAR (CHECK & RESET) -->
          <div class="surface-card rounded-3xl p-5 shadow-md flex flex-col sm:flex-row items-center justify-between gap-4 border-2" style="border-color: var(--primary-border);">
            <div class="text-center sm:text-start">
              ${
                isChecked
                  ? `<div class="text-base sm:text-lg font-black ${result.pct >= 60 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-600 dark:text-rose-400'}">
                      ${t().examScoreLabel(result.score, result.total, result.pct)} — ${result.pct >= 60 ? t().examPassed : t().examFailed}
                    </div>`
                  : `<div class="text-sm font-extrabold text-body-c">${escapeHtml(exam.title)}</div>`
              }
            </div>
            <div class="flex flex-wrap items-center justify-center gap-2.5">
              <button
                type="button"
                onclick="checkExam(${exam.thema})"
                class="px-5 py-2.5 rounded-2xl btn-primary font-extrabold text-xs sm:text-sm shadow-md transition cursor-pointer"
              >${t().examCheckBtn}</button>
              <button
                type="button"
                onclick="resetExam(${exam.thema})"
                class="px-4 py-2.5 rounded-2xl surface-subtle hover:opacity-85 font-bold text-xs sm:text-sm transition cursor-pointer"
              >${t().examResetBtn}</button>

          </div>
        </div>
      `;
    }

    // =========================================================================
    // 12. GLOBAL SEARCH (GRAMMAR + VOCABULARY + IRREGULAR VERBS)
    // =========================================================================
    const searchInput = document.getElementById('global-search');
    const searchResults = document.getElementById('search-results');
    const clearSearchBtn = document.getElementById('clear-search-btn');

    function handleGlobalSearch() {
      const q = searchInput.value.trim().toLowerCase();
      if (!q) {
        searchResults.classList.add('hidden');
        clearSearchBtn.classList.add('hidden');
        return;
      }
      clearSearchBtn.classList.remove('hidden');

      const lessonMatches = LESSONS.filter((l) =>
        l.id.toLowerCase().includes(q) ||
        l.title.toLowerCase().includes(q) ||
        l.subtitleAr.includes(q) ||
        l.subtitleEn.toLowerCase().includes(q)
      ).slice(0, 5);

      const vocabMatches = VOCABULARY.filter((v) =>
        v.word.toLowerCase().includes(q) ||
        v.en.toLowerCase().includes(q) ||
        v.ar.includes(q)
      ).slice(0, 5);

      const verbMatches = IRREGULAR_VERBS.filter((v) =>
        v.inf.toLowerCase().includes(q) ||
        v.ovtSg.toLowerCase().includes(q) ||
        v.vd.toLowerCase().includes(q) ||
        v.en.toLowerCase().includes(q) ||
        v.ar.includes(q)
      ).slice(0, 5);

      const rows = [
        ...lessonMatches.map((l) => `
          <button type="button" onclick="jumpToLesson('${l.id}')" class="w-full text-start px-4 py-2.5 hover:opacity-85 flex items-center justify-between gap-2 cursor-pointer">
            <div class="min-w-0">
              <div class="text-xs font-extrabold"><span class="badge-primary px-1.5 py-0.5 rounded font-latin">Abc ${l.id}</span> ${escapeHtml(state.lang === 'ar' ? l.subtitleAr : l.subtitleEn)}</div>
              <div dir="ltr" class="font-latin text-[11px] text-muted-c truncate text-left">${escapeHtml(l.title)}</div>
            </div>
            <span class="text-xs font-bold shrink-0" style="color: var(--primary);">${t().openLabel}</span>
          </button>
        `),
        ...vocabMatches.map((v) => `
          <button type="button" onclick="jumpToVocab('${escapeHtml(v.word.replace(/'/g, "\\'"))}')" class="w-full text-start px-4 py-2.5 hover:opacity-85 flex items-center justify-between gap-2 cursor-pointer">
            <div class="min-w-0">
              <div class="text-xs font-extrabold"><span class="badge-primary px-1.5 py-0.5 rounded">📖 T${v.thema}</span> <span class="font-latin">${escapeHtml(v.word)}</span></div>
              <div class="text-[11px] text-muted-c truncate">${state.lang === 'ar' ? escapeHtml(v.ar) + ' • ' : ''}${escapeHtml(v.en)}</div>
            </div>
            <span class="text-xs font-bold shrink-0" style="color: var(--primary);">${t().openLabel}</span>
          </button>
        `),
        ...verbMatches.map((v) => `
          <button type="button" onclick="jumpToVerb('${escapeHtml(v.inf)}')" class="w-full text-start px-4 py-2.5 hover:opacity-85 flex items-center justify-between gap-2 cursor-pointer">
            <div class="min-w-0">
              <div class="text-xs font-extrabold"><span class="badge-primary px-1.5 py-0.5 rounded font-latin">⚡ ${escapeHtml(v.inf)}</span> <span class="font-latin text-muted-c">${escapeHtml(v.ovtSg)} · ${escapeHtml(v.vd)}</span></div>
              <div class="text-[11px] text-muted-c truncate">${state.lang === 'ar' ? escapeHtml(v.ar) + ' • ' : ''}${escapeHtml(v.en)}</div>
            </div>
            <span class="text-xs font-bold shrink-0" style="color: var(--primary);">${t().openLabel}</span>
          </button>
        `),
      ];

      searchResults.innerHTML = rows.length
        ? rows.join('')
        : `<div class="p-4 text-center text-xs font-bold text-muted-c">${t().searchEmpty(escapeHtml(q))}</div>`;
      searchResults.classList.remove('hidden');
    }

    searchInput.addEventListener('input', handleGlobalSearch);
    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchResults.classList.add('hidden');
      clearSearchBtn.classList.add('hidden');
    });
    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
        searchResults.classList.add('hidden');
      }
    });

    // =========================================================================
    // 13. INTERACTION HANDLERS
    // =========================================================================
    function changeFontSize(delta) {
      const next = Math.max(0, Math.min(FONT_SIZES.length - 1, state.fontIdx + delta));
      if (next === state.fontIdx) return;
      state.fontIdx = next;
      saveState();
      applyDocumentSettings();
      showToast(t().fontToast(FONT_SIZES[state.fontIdx]));
    }

    function resetFontSize() {
      state.fontIdx = 2;
      saveState();
      applyDocumentSettings();
      showToast(t().fontToast(100));
    }

    function selectSection(sec) {
      stopExamListening();
      state.activeSection = sec;
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function setLangMode(mode) {
      state.lang = mode;
      saveState();
      renderAll();
    }

    function setPalette(name) {
      state.palette = name;
      saveState();
      applyDocumentSettings();
      renderAll();
    }

    function toggleDarkMode() {
      state.dark = !state.dark;
      saveState();
      applyDocumentSettings();
      renderAll();
    }

    function toggleColor() {
      state.showColor = !state.showColor;
      renderLegendAndToggles();
      renderMainContent();
    }

    function toggleAr() {
      state.showAr = !state.showAr;
      renderLegendAndToggles();
      renderMainContent();
    }

    function toggleEn() {
      state.showEn = !state.showEn;
      renderLegendAndToggles();
      renderMainContent();
    }

    function selectTheme(themeId) {
      state.activeSection = 'grammar';
      state.activeTheme = themeId;
      const first = LESSONS.find((l) => l.thema === themeId);
      if (first) state.activeLessonId = first.id;
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function selectLesson(lessonId) {
      const target = LESSONS.find((l) => l.id === lessonId);
      if (!target) return;
      state.activeSection = 'grammar';
      state.activeTheme = target.thema;
      state.activeLessonId = target.id;
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToLesson(lessonId) {
      searchResults.classList.add('hidden');
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      selectLesson(lessonId);
    }

    function jumpToVocab(word) {
      searchResults.classList.add('hidden');
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      state.activeSection = 'vocab';
      state.vocabThema = 'all';
      state.vocabImp = 'all';
      state.vocabSearch = word;
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToVerb(inf) {
      searchResults.classList.add('hidden');
      searchInput.value = '';
      clearSearchBtn.classList.add('hidden');
      state.activeSection = 'verbs';
      state.verbThema = 'all';
      state.verbAuxFilter = 'all';
      state.verbSearch = inf;
      saveState();
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleStudied(lessonId) {
      state.studied[lessonId] = !state.studied[lessonId];
      saveState();
      renderProgress();
      renderSidebarAndMobileBar();
      renderMainContent();
      showToast(state.studied[lessonId] ? t().studiedToastOn : t().studiedToastOff);
    }

    function answerQuiz(lessonId, qIdx, optIdx) {
      state.answers[`${lessonId}-${qIdx}`] = optIdx;
      const lesson = LESSONS.find((l) => l.id === lessonId);
      if (lesson && isLessonQuizPassed(lesson)) {
        state.studied[lessonId] = true;
      }
      saveState();
      renderProgress();
      renderThemeNav();
      renderSidebarAndMobileBar();
      renderMainContent();
    }

    function resetLessonQuiz(lessonId) {
      const lesson = LESSONS.find((l) => l.id === lessonId);
      if (!lesson) return;
      lesson.quiz.forEach((_, idx) => delete state.answers[`${lessonId}-${idx}`]);
      saveState();
      renderProgress();
      renderThemeNav();
      renderSidebarAndMobileBar();
      renderMainContent();
      showToast(t().resetQuizToast(lessonId));
    }

    // Vocabulary Handlers
    function setVocabSort(sort) { state.vocabSort = sort; renderMainContent(); }
    function setVocabThema(th) { state.vocabThema = th; renderMainContent(); }
    function setVocabImp(imp) { state.vocabImp = imp; renderMainContent(); }
    function setVocabView(view) { state.vocabView = view; renderMainContent(); }
    function toggleVocabSelfTest() {
      state.vocabSelfTest = !state.vocabSelfTest;
      state.vocabRevealed = {};
      renderMainContent();
    }
    function revealVocab(id) {
      state.vocabRevealed[id] = true;
      renderMainContent();
    }
    function toggleLearnedVocab(id) {
      state.learnedVocab[id] = !state.learnedVocab[id];
      saveState();
      renderLegendAndToggles();
      renderMainContent();
    }

    // Irregular Verbs Handlers
    function setVerbSort(sort) { state.verbSort = sort; renderMainContent(); }
    function setVerbFilter(aux) { state.verbAuxFilter = aux; renderMainContent(); }
    function setVerbThema(th) { state.verbThema = th; renderMainContent(); }
    function setVerbView(view) { state.verbView = view; renderMainContent(); }
    function toggleLearnedVerb(id) {
      state.learnedVerbs[id] = !state.learnedVerbs[id];
      saveState();
      renderLegendAndToggles();
      renderMainContent();
    }

    // Interactive Exams Handlers
    function selectExamThema(th) {
      stopExamListening();
      state.activeExamThema = th;
      saveState();
      renderMainContent();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function playExamListening(th) {
      const exam = EXAMS.find((e) => e.thema === th);
      if (!exam) return;
      if (!('speechSynthesis' in window)) {
        showToast(t().ttsUnsupported);
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(exam.listening.script);
        utter.lang = 'nl-NL';
        utter.rate = state.examRate;
        const voices = window.speechSynthesis.getVoices();
        const nlVoice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('nl'));
        if (nlVoice) utter.voice = nlVoice;

        state.examPlayingThema = th;
        renderMainContent();

        utter.onend = () => {
          state.examPlayingThema = null;
          if (state.activeSection === 'exams') renderMainContent();
        };
        utter.onerror = () => {
          state.examPlayingThema = null;
          if (state.activeSection === 'exams') renderMainContent();
          showToast(t().ttsError);
        };
        window.speechSynthesis.speak(utter);
      } catch (e) {
        state.examPlayingThema = null;
        showToast(t().ttsError);
      }
    }

    function stopExamListening() {
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      if (state.examPlayingThema !== null) {
        state.examPlayingThema = null;
        if (state.activeSection === 'exams') renderMainContent();
      }
    }

    function toggleExamSpeed() {
      state.examRate = state.examRate < 0.9 ? 1.0 : 0.8;
      if (state.examPlayingThema !== null) {
        playExamListening(state.examPlayingThema);
      } else {
        renderMainContent();
      }
    }

    function toggleExamTranscript(th) {
      const sess = getExamSession(th);
      sess.showTranscript = !sess.showTranscript;
      renderMainContent();
    }

    function selectExamMcq(th, partKey, qIdx, optIdx) {
      const sess = getExamSession(th);
      sess[partKey][qIdx] = optIdx;
      renderMainContent();
    }

    function updateExamInput(th, partKey, key, val) {
      const sess = getExamSession(th);
      sess[partKey][key] = val;
    }

    function toggleExamModel(th, idx) {
      const sess = getExamSession(th);
      sess.p5Model[idx] = !sess.p5Model[idx];
      renderMainContent();
    }

    function toggleExamSelfCheck(th, idx, isChecked) {
      const sess = getExamSession(th);
      sess.p5Check[idx] = isChecked;
      if (sess.checked) {
        checkExam(th, true);
      }
    }

    function checkExam(th, silent = false) {
      const exam = EXAMS.find((e) => e.thema === th);
      if (!exam) return;
      const sess = getExamSession(th);
      sess.checked = true;
      const res = computeExamScore(exam, sess);
      const prevBest = state.examBestScores[th] || 0;
      if (res.pct > prevBest) state.examBestScores[th] = res.pct;
      saveState();
      renderLegendAndToggles();
      renderMainContent();
      if (!silent) showToast(t().examGradedToast(res.pct));
    }

    function resetExam(th) {
      stopExamListening();
      state.examState[th] = {
        p1: {}, p2: {}, p3: {}, p4: {}, p5Text: {}, p5Check: {}, p5Model: {}, p6: {},
        showTranscript: false, checked: false,
      };
      renderMainContent();
      showToast(t().examResetToast(th));
    }

    document.getElementById('reset-all-btn').addEventListener('click', () => {
      stopExamListening();
      state.answers = {};
      state.studied = {};
      state.learnedVocab = {};
      state.learnedVerbs = {};
      state.examBestScores = {};
      state.examState = {};
      saveState();
      renderAll();
      showToast(t().resetAllToast);
    });

    function renderAll() {
      applyDocumentSettings();
      renderProgress();
      renderLegendAndToggles();
      renderThemeNav();
      renderSidebarAndMobileBar();
      renderMainContent();
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.getVoices();
    }

    loadState();
    renderAll();
  </script>

  <!-- Firebase Realtime Database: Live Online & Total Visits Counter -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getDatabase,
      ref,
      set,
      remove,
      onValue,
      onDisconnect,
      runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const DATABASE_URL = "https://taalcompleet-stats-default-rtdb.europe-west1.firebasedatabase.app";

    // Sync visitor counter labels automatically when user switches AR <-> EN
    function syncCounterLang() {
      const isEn = document.documentElement.dir === "ltr" || document.documentElement.lang === "en";
      const lblOnline = document.getElementById("lbl-online");
      const lblTotal = document.getElementById("lbl-total");
      if (lblOnline) lblOnline.textContent = isEn ? "Online now:" : "متصل الآن:";
      if (lblTotal) lblTotal.textContent = isEn ? "Total visits:" : "إجمالي الزيارات:";
    }

    syncCounterLang();
    new MutationObserver(syncCounterLang).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["dir", "lang"]
    });

    function setFallbackStats() {
      const onlineEl = document.getElementById("val-online");
      const totalEl = document.getElementById("val-total");
      if (onlineEl && onlineEl.textContent === "...") onlineEl.textContent = "1";
      if (totalEl && totalEl.textContent === "...") totalEl.textContent = "—";
    }

    // Connect to Firebase Realtime Database with graceful offline fallback
    try {
      const app = initializeApp({ databaseURL: DATABASE_URL });
      const db = getDatabase(app);

      // 1) Total visits counter (increment once per browser session)
      const totalRef = ref(db, "stats/totalVisits");
      try {
        if (!sessionStorage.getItem("nl_a2_pro_counted")) {
          runTransaction(totalRef, (current) => (current || 0) + 1)
            .then(() => {
              try { sessionStorage.setItem("nl_a2_pro_counted", "1"); } catch (_) {}
            })
            .catch(() => {});
        }
      } catch (_) {}

      onValue(
        totalRef,
        (snap) => {
          const val = snap.val();
          const el = document.getElementById("val-total");
          if (el) el.textContent = typeof val === "number" ? val.toLocaleString() : "—";
        },
        () => setFallbackStats()
      );

      // 2) Accurate live presence: 1 ID per browser + 25s heartbeat + auto-cleanup of stale/ghost entries
      let clientId = null;
      try {
        clientId = localStorage.getItem("nl_a2_pro_client_id");
        if (!clientId) {
          clientId = "u_" + Math.random().toString(36).slice(2, 11) + "_" + Date.now();
          localStorage.setItem("nl_a2_pro_client_id", clientId);
        }
      } catch (_) {
        clientId = "u_" + Math.random().toString(36).slice(2, 11) + "_" + Date.now();
      }

      const myOnlineRef = ref(db, `stats/online/${clientId}`);
      const allOnlineRef = ref(db, "stats/online");
      const connectedRef = ref(db, ".info/connected");
      const offsetRef = ref(db, ".info/serverTimeOffset");

      let serverOffset = 0;
      let heartbeatTimer = null;
      const STALE_MS = 70000; // Sessions inactive for >70s are treated as offline
      const getServerNow = () => Date.now() + serverOffset;

      onValue(offsetRef, (snap) => {
        serverOffset = snap.val() || 0;
      });

      const sendHeartbeat = () => {
        set(myOnlineRef, getServerNow()).catch(() => {});
      };

      onValue(
        connectedRef,
        (snap) => {
          if (snap.val() === true) {
            // Register onDisconnect FIRST, then write timestamp and start heartbeat
            onDisconnect(myOnlineRef)
              .remove()
              .then(() => {
                sendHeartbeat();
                clearInterval(heartbeatTimer);
                heartbeatTimer = setInterval(sendHeartbeat, 25000);
              })
              .catch(() => {});
          } else {
            clearInterval(heartbeatTimer);
          }
        },
        () => setFallbackStats()
      );

      // Immediately remove presence when closing the tab
      window.addEventListener("pagehide", () => {
        clearInterval(heartbeatTimer);
        remove(myOnlineRef).catch(() => {});
      });

      // Refresh presence immediately when returning to the tab
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") sendHeartbeat();
      });

      onValue(
        allOnlineRef,
        (snap) => {
          const data = snap.val();
          const now = getServerNow();
          let activeCount = 0;

          if (data && typeof data === "object") {
            Object.entries(data).forEach(([key, val]) => {
              if (typeof val === "number" && now - val < STALE_MS) {
                activeCount++;
              } else if (key !== clientId) {
                // Automatically purge old `true` or expired ghost sessions from DB
                remove(ref(db, `stats/online/${key}`)).catch(() => {});
              }
            });
          }

          const el = document.getElementById("val-online");
          if (el) el.textContent = Math.max(1, activeCount).toLocaleString();
        },
        () => setFallbackStats()
      );
    } catch (_) {
      setFallbackStats();
    }
  </script>
</body>
</html>
